<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenStream push-to-talk</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body data-state="recording">
    <main class="overlay" aria-live="polite">
      <section class="recording" data-recording>
        <span data-status>Listening</span>
        <span class="waveform" aria-hidden="true">
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
          <span class="waveform__bar" data-bar></span>
        </span>
      </section>
      <section class="held-result" data-held-result>
        <h1>Couldn't place text</h1>
        <p>Still here. Copy it and paste it where you want.</p>
        <pre data-held-text></pre>
        <div class="held-result__actions">
          <button type="button" data-copy>Copy</button>
          <button type="button" class="secondary" data-dismiss>Dismiss</button>
        </div>
      </section>
    </main>
    <script src="overlay.js"></script>
  </body>
</html>
