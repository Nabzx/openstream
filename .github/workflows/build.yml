name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# macOS runners are capped at 5 concurrent jobs account-wide (a GitHub
# limit, not something this repo controls) - with several people/agents
# pushing to different branches at once, that cap gets exhausted fast and
# leaves later runs stuck queued or failing outright. Cancelling a run's
# own superseded predecessor when a new commit lands on the same
# branch/PR - the group key pairs workflow name with ref - frees its slot
# immediately instead of holding it for a result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - run: npm ci
      - run: npm run build
      # #425: this used to be the whole check - typecheck and a renderer
      # build, but never the ~35 electron test files or the src/ vitest
      # suite. A PR could break dictationCoordinator.test.js and still
      # merge on a green check, because the check never looked.
      - run: npm test
      # #440: hotkey-helper and accessibility-helper both have real Swift
      # test suites, wired as .testTarget in their Package.swift, that no
      # CI workflow or npm script ever invoked - a native-side regression
      # could merge on a green check the same way #425's electron tests
      # could. transcription-helper has no test target yet (needs FluidAudio
      # mocked out first) and isn't built here either - still open.
      - run: swift test --package-path native/hotkey-helper
      - run: swift test --package-path native/accessibility-helper
