<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenStream app icon: the mark (a caret inside a listening ring) in
       phosphor blue on a navy tile - a soft blue bloom and a hairline
       frame. Source for assets/icon.icns and the menu-bar icons,
       generated by scripts/build-icons.sh.
       Palette matches docs/design/visual-identity.md. -->
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.36" r="0.82">
      <stop offset="0" stop-color="#163A6B"/>
      <stop offset="0.55" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#0A1730"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CB8FF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#5CB8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5CB8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileclip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileclip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <rect x="140" y="144" width="744" height="744" fill="url(#bloom)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#2E4E7A" stroke-width="6"/>

  <g fill="none" stroke="#5CB8FF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="512" cy="524" r="262"/>
    <path d="M402 583 512 464 622 583"/>
  </g>
</svg>
