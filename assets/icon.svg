<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenStream app icon: the mark (a caret inside a listening ring) in
       phosphor green on a near-black terminal tile - a faint scanline, a
       soft green bloom, a hairline frame. Source for assets/icon.icns and
       the menu-bar icons, generated by scripts/build-icons.sh.
       Palette matches docs/design/visual-identity.md. -->
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0" stop-color="#0B1A0E"/>
      <stop offset="1" stop-color="#020402"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DF65A" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#3DF65A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3DF65A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none"/>
      <rect width="12" height="3" y="4" fill="#000000" opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileclip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileclip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <rect x="150" y="154" width="724" height="724" fill="url(#bloom)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#scan)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="#24382A" stroke-width="6"/>

  <g fill="none" stroke="#3DF65A" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="512" cy="524" r="262"/>
    <path d="M402 583 512 464 622 583"/>
  </g>
</svg>
