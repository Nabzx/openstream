<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #007aff; } a:hover { color: #0063cc; }

    .win {
      --bg: #ffffff; --sidebar: #ececec; --surface-2: #f5f5f7;
      --text: #1d1d1f; --text-2: #6e6e73; --sep: rgba(0,0,0,0.10);
      --accent: #007aff; --accent-tint: rgba(0,122,255,0.14); --green: #34c759;
      --keycap: #ffffff; --keycap-b: rgba(0,0,0,0.16);
      width: 100%; height: 100%; display: flex; background: var(--bg); color: var(--text);
      border-radius: 12px; overflow: hidden; position: relative; font-size: 13px; line-height: 1.4;
    }
    .traffic { position: absolute; top: 18px; left: 16px; display: flex; gap: 8px; z-index: 3; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
    .traffic i:nth-child(2) { background: #febc2e; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
    .traffic i:nth-child(3) { background: #28c840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }

    .sidebar { width: 176px; flex: 0 0 176px; background: var(--sidebar); border-right: 1px solid var(--sep); padding: 52px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
    .navitem { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--text); font-weight: 500; cursor: default; }
    .navitem svg { width: 16px; height: 16px; color: var(--text-2); }
    .navitem.is-active { background: var(--accent-tint); color: var(--accent); }
    .navitem.is-active svg { color: var(--accent); }
    .sidebar .spacer { flex: 1; }
    .quit { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 10px; color: var(--text-2); font-size: 12px; }
    .quit svg { width: 15px; height: 15px; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .titlebar { height: 40px; flex: 0 0 40px; -webkit-app-region: drag; }
    .body { flex: 1; overflow: auto; padding: 6px 24px 24px; display: flex; flex-direction: column; gap: 18px; }

    .hero { display: flex; align-items: center; gap: 14px; padding: 2px; }
    .beacon { position: relative; width: 12px; height: 12px; flex: 0 0 12px; }
    .beacon i { position: absolute; inset: 0; border-radius: 50%; background: var(--green); }
    .beacon i::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--green); opacity: 0.35; }
    .hero h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .hero p { margin: 2px 0 0; color: var(--text-2); }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 0.5px rgba(0,0,0,0.06); }
    .card-h { padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-2); }
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--sep); }
    .row:first-child { border-top: 0; }
    .row .ic { width: 18px; height: 18px; color: var(--text-2); flex: 0 0 18px; }
    .row .lbl { flex: 1; }
    .keys { display: flex; gap: 4px; }
    .keycap { min-width: 22px; height: 22px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; background: var(--keycap); border: 1px solid var(--keycap-b); border-bottom-width: 2px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(52,199,89,0.16); color: #248a3d; }
    .pill svg { width: 13px; height: 13px; }
    .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 14px 28px; color: var(--text-2); text-align: center; font-size: 12px; }
    .empty svg { width: 22px; height: 22px; opacity: 0.7; }
  </style>
</helmet>

<div class="win">
  <div class="traffic"><i></i><i></i><i></i></div>

  <div class="sidebar">
    <div class="navitem is-active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10v9h12v-9"/></svg>
      Home
    </div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.2 7l2.1 1.2M17.7 15.8l2.1 1.2M4.2 17l2.1-1.2M17.7 8.2l2.1-1.2"/></svg>
      Settings
    </div>
    <div class="spacer"></div>
    <div class="quit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3M16 12H9M13 8l4 4-4 4"/></svg>
      Quit OpenStream
    </div>
  </div>

  <div class="main">
    <div class="titlebar"></div>
    <div class="body">
      <div class="hero">
        <span class="beacon"><i></i></span>
        <div>
          <h1>OpenStream is listening</h1>
          <p>Hold <b>&#8963;&#8997;D</b> anywhere and speak.</p>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
          <span class="lbl">Push-to-talk shortcut</span>
          <span class="keys"><span class="keycap">&#8963;</span><span class="keycap">&#8997;</span><span class="keycap">D</span></span>
        </div>
      </div>

      <div class="card">
        <div class="card-h">Status</div>
        <div class="row"><span class="lbl">Accessibility</span><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Granted</span></div>
        <div class="row"><span class="lbl">Input Monitoring</span><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Granted</span></div>
        <div class="row"><span class="lbl">Microphone</span><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Granted</span></div>
        <div class="row"><span class="lbl">On-device models</span><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Ready</span></div>
      </div>

      <div class="card">
        <div class="card-h">Recent</div>
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Your recent dictations will appear here.
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
